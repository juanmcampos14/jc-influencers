services:
  db:
    image: postgres:16-alpine
    container_name: jc_influencers_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jc_owner
      POSTGRES_PASSWORD: jc_owner_dev_password
      POSTGRES_DB: jc_influencers
    ports:
      - '55432:5432'
    volumes:
      - jc_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jc_owner -d jc_influencers']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: jc_influencers_minio
    restart: unless-stopped
    command: server /data --console-address ":59001"
    environment:
      MINIO_ROOT_USER: jc_minio_admin
      MINIO_ROOT_PASSWORD: jc_minio_dev_password
    ports:
      - '59000:9000'
      - '59001:59001'
    volumes:
      - jc_miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  jc_pgdata:
  jc_miniodata:
